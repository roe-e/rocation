    function getCatBadge(cat) {
        if (cat === 'food') return '<span class="cat-badge" style="background:#e07a5f;">맛집</span>';
        if (cat === 'cafe') return '<span class="cat-badge" style="background:#81b29a;">카페</span>';
        return '<span class="cat-badge" style="background:#3d405b;">볼거리/명소</span>';
    }

    // 배열 무작위 셔플 함수
    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    // 선택된 지역 2곳에서 음식점 1곳, 관광지 2곳, 카페 1곳 무작위 추출
    function selectFourPlaces(dataMap, districtList) {
        let combinedPlaces = [];
        districtList.forEach(d => {
            if (dataMap[d]) {
                combinedPlaces = combinedPlaces.concat(dataMap[d]);
            }
        });

        const foodList = shuffleArray(combinedPlaces.filter(p => p.cat === 'food'));
        const attractionList = shuffleArray(combinedPlaces.filter(p => p.cat === 'attraction'));
        const cafeList = shuffleArray(combinedPlaces.filter(p => p.cat === 'cafe'));

        const selected = [];
        if (foodList.length > 0) selected.push(foodList[0]);
        if (attractionList.length > 0) selected.push(attractionList[0]);
        if (attractionList.length > 1) selected.push(attractionList[1]);
        if (cafeList.length > 0) selected.push(cafeList[0]);

        return selected;
    }

                <a href="${mapUrl}" target="_blank" class="detail-place-item">

                </a>`;
        });

        resBox.style.display = 'block';
        resBox.innerHTML = listHtml;
    }
